name: FaunaBench validation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  zero-cost-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev,analysis,providers]' 'agent-client-protocol==0.12.1'
      - run: make check PYTHON=python
      - uses: actions/upload-artifact@v4
        with:
          name: scripted-validation-not-model-results
          path: artifacts/
